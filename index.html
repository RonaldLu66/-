<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 19th Birthday ❤️</title>
    <style>
        :root {
            --primary-pink: #FF8FB1;
            --light-pink: #FFC0D3;
            --bg-cream: #FFF5F7;
            --accent-gold: #F7D794;
            --deep-pink: #F25287;
            --shadow: 0 8px 30px rgba(255, 143, 177, 0.25);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #FFF5F7 0%, #FFE6EF 100%);
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: #555;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 背景光晕装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,192,211,0.3) 0%, transparent 70%);
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -40%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(247,215,148,0.25) 0%, transparent 70%);
            z-index: 0;
        }

        .section {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .active {
            display: flex;
            animation: fadeIn 0.9s cubic-bezier(0.33, 1, 0.68, 1) forwards;
        }

        /* 按钮美化 */
        .btn {
            background: linear-gradient(45deg, var(--primary-pink), var(--deep-pink));
            border: none;
            padding: 15px 38px;
            border-radius: 50px;
            color: white;
            font-size: 19px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            margin-top: 25px;
            position: relative;
            overflow: hidden;
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.03); 
            box-shadow: 0 12px 35px rgba(255, 143, 177, 0.4);
        }
        .btn:active { transform: translateY(0); }

        /* 漂浮爱心升级 */
        .heart-bg {
            position: fixed;
            color: var(--primary-pink);
            font-size: 20px;
            opacity: 0.6;
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.1) rotate(15deg); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 文字样式升级 */
        .title { 
            background: linear-gradient(90deg, var(--deep-pink), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 34px; 
            font-weight: 700;
            margin-bottom: 15px; 
            line-height: 1.3;
        }
        .subtitle { 
            font-size: 18px; 
            color: #888; 
            margin-bottom: 45px; 
            font-weight: 400;
        }

        /* 答题选项美化 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 340px;
            margin-top: 35px;
        }
        .opt-btn {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            color: var(--primary-pink);
            border: 2px solid var(--light-pink);
            padding: 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,192,211,0.15);
        }
        .opt-btn:hover { 
            background: var(--primary-pink); 
            color: white; 
            border-color: var(--primary-pink);
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(255,143,177,0.3);
        }

        /* 通关告白页美化 */
        .confession-page {
            padding: 0 25px;
        }
        .confession-text {
            font-size: 21px;
            line-height: 1.9;
            color: #666;
            max-width: 420px;
            margin: 35px 0;
            font-weight: 400;
        }
        .confession-text span {
            background: linear-gradient(90deg, var(--deep-pink), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .heart-icon {
            font-size: 60px;
            color: var(--primary-pink);
            animation: heartbeat 1.2s ease-in-out infinite;
            margin-bottom: 25px;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 100个理由容器美化 */
        .reasons-container {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px);
            width: 92%;
            max-width: 420px;
            height: 65vh;
            overflow-y: auto;
            border-radius: 25px;
            box-shadow: var(--shadow);
            padding: 25px;
            text-align: left;
            border: 1px solid rgba(255,192,211,0.3);
        }
        .reason-item {
            padding: 16px 12px;
            border-bottom: 1px dashed var(--light-pink);
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-out backwards;
            transition: all 0.3s ease;
        }
        .reason-item:hover {
            background-color: rgba(255,240,243,0.8);
            border-radius: 12px;
            transform: translateX(6px);
            padding-left: 18px;
        }
        .reason-item:last-child {
            border-bottom: none;
        }

        /* 滚动条美化 */
        .reasons-container::-webkit-scrollbar { width: 7px; }
        .reasons-container::-webkit-scrollbar-track { background: #f8f8f8; border-radius: 10px; }
        .reasons-container::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--light-pink), var(--primary-pink)); 
            border-radius: 10px; 
        }

        /* 生日小装饰 */
        .decoration {
            position: absolute;
            font-size: 24px;
            opacity: 0.8;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <!-- 首页 -->
    <div id="home" class="section active">
        <h1 class="title">祝宝宝十九岁生日快乐！🎉</h1>
        <p class="subtitle">天天开心，永远被爱包围</p>
        <button class="btn" onclick="startGame()">开启专属惊喜 ❤️</button>
    </div>

    <!-- 答题页 -->
    <div id="game" class="section">
        <h2 id="q-title" class="title">心动答题挑战</h2>
        <div id="q-options" class="options-container"></div>
    </div>

    <!-- 通关告白过渡页 -->
    <div id="confession" class="section confession-page">
        <div class="heart-icon">💓</div>
        <h1 class="title">通关成功啦～🥳</h1>
        <p class="confession-text">
            宝宝，这是为你准备的<br>
            <span>100个超喜欢你的理由</span><br>
            都是我这几天慢慢写的～
        </p>
        <button class="btn" onclick="showReasons()">点击查看 💘</button>
    </div>

    <!-- 100个理由页 -->
    <div id="reasons" class="section">
        <h2 class="title">我喜欢你的100个理由 💖</h2>
        <div id="reasons-list" class="reasons-container"></div>
    </div>

    <!-- 背景音乐：陶喆 - 暗恋 -->
    <audio autoplay loop>
        <source src="https://webfs.ali.kugou.com/202502261233/4c2a0059682302792962968109230595/kwm/s110/2026010110175651911.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 生成漂浮爱心背景
        function createHearts() {
            const container = document.getElementById('heart-container');
            const hearts = ['❤', '💗', '💖', '💓', '💕'];
            for(let i=0; i<25; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 18 + 12) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        // 切换页面
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 答题题库
        const questions = [
            { q: "今天你几岁了？", options: ["A. 18岁", "B. 19岁", "C. 20岁"], ans: 1 },
            { q: "我有多喜欢你？", options: ["A. 超级喜欢", "B. 超级超级喜欢", "C. 超级超级超级喜欢"], ans: 2 }
        ];
        
        let currentQ = 0;

        // 开始答题
        function startGame() {
            currentQ = 0;
            showSection('game');
            renderQuestion();
        }

        // 渲染题目
        function renderQuestion() {
            if(currentQ >= questions.length) {
                showSection('confession');
                return;
            }
            const q = questions[currentQ];
            document.getElementById('q-title').innerText = q.q;
            const optsContainer = document.getElementById('q-options');
            optsContainer.innerHTML = '';
            q.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = optText;
                btn.onclick = () => {
                    if(index === q.ans) { 
                        currentQ++; 
                        renderQuestion(); 
                    } else { 
                        alert("哎呀，选错啦！宝宝再仔细想想哦~ 🥺"); 
                    }
                };
                optsContainer.appendChild(btn);
            });
        }

        // 100个喜欢的理由
        const customReasons = [
            "有全世界最可爱的眼睛", "看到你的脸就能什么烦恼都没有", "让我其实内心挺孤独的人感觉到被人关心", 
            "可以和你说我的烦恼", "我难过的时候可以抱抱我", "给我木瓜膏", "帮我画大鹅", 
            "经常夸我", "会陪我吃好吃的", "愿意忍着被蚊子咬也和我待在一起", "经常给我发特别美的自拍", 
            "小学游泳比赛获奖了", "支持勇士队", "认识库里", "会关心我为什么难过", 
            "给我拼豆", "陪我过生日", "从哪里看都很可爱", "生气的时候也可爱", 
            "像个小兔子", "特别信任我", "会支持我的决定", "经常早睡早起", 
            "会和我一起学习", "认真上课", "努力学习", "让我养成每个消息都回的好习惯", 
            "是我的理想型", "感觉像一个发光的小兔子", "接纳我有时候很幼稚的一面", "接受我有时候的坏脾气", 
            "不小心惹你生气了很快可以哄开心", "给我多多的手机壳", "关心我在干嘛", "无缘无故叫我一下", 
            "有时候像小朋友一样", "特别大方不像有些女生很做作", "不会无理取闹", "会和我牵手", 
            "一直都有新鲜感", "对我挺宽容的虽然我脾气很烂", "有事情会立马和我讲", "不化妆的样子全世界最美", 
            "我生病不舒服会关心我", "分开的时候会给我视频", "一接通视频就看到你特别可爱", "会在视频的时候也和我亲亲", 
            "会一起打着视频睡觉", "和我挺互补", "睡觉特别可爱", "爱吃杭州的面", 
            "爱看剧", "有问题会马上和我沟通", "有话不憋着", "会记住我的很多小事", 
            "记得我有哪些鞋子", "记得我的球衣号码", "记得我哪天在上哪节课", "记得我的小狗叫什么", 
            "怕小猫", "不是特别怕老鼠", "会说想我了", "我听我说你不感兴趣的事", 
            "特别有责任感", "偷偷放一个 可惜老是不让我拍你我一拍你就生气", "醒来会马上告诉我", "愿意陪我做以前没做过的事", 
            "笑起来特别特别好看", "脸软软的", "耳朵软软的", "经常说我有香香的味道", 
            "和我在海边散步", "让我离家这么远上学有了家人陪伴的感觉", "每次待在一起就很幸福", "和你在一起是上大学最大的收获之一", 
            "你会体谅我也会表达爱", "会和我一样抽象", "待在一起不说话就感觉很棒", "一起吃鸡煲", 
            "不让我讲赛里木", "给我看你小时候的照片", "告诉我你从小到大的故事", "和我讲你的家人朋友", 
            "会询问我的意见", "走路到一半转头看到你就特别开心", "会凶巴巴的让我想剃胡子", "会逼我放弃斜刘海", 
            "我帮你按摩", "会在我需要的时候出现", "听到你的语音都感觉很开心", "叫我宝宝", 
            "我也叫你宝宝", "做事不怕麻烦", "积极向上", "我做错了会指出来", 
            "讲道理", "我说自己不好的时候都会鼓励我", "我每天都说我喜欢你", "和我永远在一起", 
            "我爱你宝宝"
        ];

        // 展示100个理由
        function showReasons() {
            const list = document.getElementById('reasons-list');
            list.innerHTML = ''; 
            for(let i = 0; i < customReasons.length; i++) {
                let div = document.createElement('div');
                div.className = 'reason-item';
                div.innerText = `${i + 1}. ${customReasons[i]}`;
                div.style.animationDelay = `${Math.min(i * 0.07, 0.5)}s`; 
                list.appendChild(div);
            }
            showSection('reasons');
        }
    </script>
</body>
</html>
